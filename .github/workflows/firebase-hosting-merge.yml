# Build dist/ and deploy to Firebase Hosting (live).
# Does not use FirebaseExtended/action-hosting-deploy (avoids GitHub codeload failures).
# Secret: FIREBASE_SERVICE_ACCOUNT_LATEXDIFF (JSON from firebase init hosting:github)

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LATEXDIFF }}

      - name: Deploy to Firebase Hosting (live)
        run: npx firebase-tools@14.4.0 deploy --only hosting --project latexdiff --non-interactive
