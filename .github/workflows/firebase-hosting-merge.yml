# Deploy to Firebase Hosting when changes are pushed to main.
# Requires repo secret: FIREBASE_SERVICE_ACCOUNT_LATEXDIFF
# (created by: firebase init hosting:github)

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LATEXDIFF }}
          channelId: live
          projectId: latexdiff
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
