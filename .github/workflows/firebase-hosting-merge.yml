# Build dist/ and deploy to Firebase Hosting (live).
# Uses only actions/checkout — no other marketplace actions (avoids codeload download failures).
# Secret: FIREBASE_SERVICE_ACCOUNT_LATEXDIFF (service account JSON)

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install, build, and deploy
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LATEXDIFF }}
        run: |
          set -euo pipefail
          node --version
          npm ci
          npm run build
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@14.4.0 deploy --only hosting --project latexdiff --non-interactive
