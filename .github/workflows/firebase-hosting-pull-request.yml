# Preview channel for pull requests (no third-party Actions except checkout).

name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install, build, and deploy preview
        id: preview
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LATEXDIFF }}
        run: |
          set -euo pipefail
          node --version
          npm ci
          npm run build
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          npx firebase-tools@14.4.0 hosting:channel:deploy "$CHANNEL" \
            --only hosting \
            --project latexdiff \
            --expires 7d \
            --non-interactive 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[^[:space:]]+' deploy.log | grep -E 'web\.app|firebaseapp\.com' | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "Firebase Hosting preview: ${{ steps.preview.outputs.url }}"
