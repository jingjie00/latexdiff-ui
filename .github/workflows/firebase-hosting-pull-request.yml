# Preview channel for pull requests.

name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LATEXDIFF }}

      - name: Deploy preview channel
        id: preview
        run: |
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          npx firebase-tools@14.4.0 hosting:channel:deploy "$CHANNEL" \
            --only hosting \
            --project latexdiff \
            --expires 7d \
            --non-interactive 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[^[:space:]]+' deploy.log | grep -E 'web\.app|firebaseapp\.com' | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const body = `Firebase Hosting preview: ${url}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
